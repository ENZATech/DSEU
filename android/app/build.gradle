plugins { id 'com.android.application' }

def campusdeskApiBaseUrl = (project.findProperty('campusdeskApiBaseUrl') ?: 'https://campusdesk-api-j6os.onrender.com').toString()

android {
    namespace 'com.campusdesk.app'
    compileSdk 35
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId 'com.campusdesk.app'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '1.1'
        buildConfigField 'String', 'CAMPUSDESK_API_BASE_URL', "\"${campusdeskApiBaseUrl}\""
    }
}
